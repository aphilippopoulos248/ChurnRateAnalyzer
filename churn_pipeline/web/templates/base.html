<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Churn Pipeline{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:10px">
    <div class="eyebrow"><a href="{{ url_for('index') }}" style="color:inherit;text-decoration:none">Churn analysis pipeline</a> · Python · scikit-learn · Gemini</div>
    {% block header %}{% endblock %}
  </header>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash" role="alert">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
